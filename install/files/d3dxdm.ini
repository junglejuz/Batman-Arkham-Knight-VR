;dm_hud_depth_override = -1.0
dm_auto_convergence = 0
dm_auto_convergence_uav_buffer_updates = 1
dm_hud_depth_max_offset_in = 0.002

dm_min_convergence = 0.1
dm_max_convergence_soft = 6.0
dm_max_convergence_hard = 8.0
dm_popout_bias = 0.02
dm_slow_convergence_rate = 5.0
dm_slow_convergence_threshold_near = 0.0
dm_slow_convergence_threshold_far = 0.0
dm_instant_convergence_threshold = 4.0
dm_anti_judder_threshold = 0.5
dm_auto_convergence_hud_enabled = 1
dm_auto_convergence_hud_timeout = 2.0
dm_warn_no_z_buffer = 1
dm_patching_mode = 0
dm_auto_scissor_rect = 0
dm_auto_convergence_post_present = 1
;surface_createmode=5

dm_min_convergence_absolute_override = 5.0
dm_max_convergence_soft_absolute_override = 125.0
dm_max_convergence_hard_absolute_override = 250.0
dm_slow_convergence_rate_absolute_override = 80.0
dm_slow_convergence_threshold_near_absolute_override = 30.0
dm_slow_convergence_threshold_far_absolute_override= 30.0
dm_instant_convergence_threshold_absolute_override= 120.0
dm_anti_judder_threshold_absolute_override= 0.02

popout_conv_step_up_multi = 1.01
popout_conv_step_down_multi = 0.99

;------------------------------------------------------------------------------------------------------
;------------------------------------------------------------------------------------------------------
; Settings for direct_mode = anaglyph: the color matrices for the glasses.
;------------------------------------------------------------------------------------------------------
;
; Each eye's color is transformed by a row-major 3x3 matrix, then summed:
;   output = clamp(M_left * left_rgb + M_right * right_rgb)
; The three rows produce the output R, G, B channels; each row holds the
; input r, g, b weights for that channel.
;
; The defaults are the Dubois matrices for red-cyan glasses: the highest
; quality anaglyph method (least ghosting, best color reproduction).
;
; Other classic red-cyan methods, if you prefer their look - replace the rows:
;   half-color: left  =  0.299, 0.587, 0.114  /  0, 0, 0  /  0, 0, 0
;               right =  0, 0, 0  /  0, 1, 0  /  0, 0, 1
;   gray:       left  =  0.299, 0.587, 0.114  /  0, 0, 0  /  0, 0, 0
;               right =  0, 0, 0  /  0.299, 0.587, 0.114  /  0.299, 0.587, 0.114
;   optimized:  left  =  0, 0.7, 0.3  /  0, 0, 0  /  0, 0, 0
;               right =  0, 0, 0  /  0, 1, 0  /  0, 0, 1
; Green-magenta or amber-blue glasses work too, with their published Dubois
; matrix sets.
;------------------------------------------------------------------------------------------------------

[Anaglyph]

anaglyph_left_row1  = 0.437, 0.449, 0.164
anaglyph_left_row2  = -0.062, -0.062, -0.024
anaglyph_left_row3  = -0.048, -0.050, -0.017

anaglyph_right_row1 = -0.011, -0.032, -0.007
anaglyph_right_row2 = 0.377, 0.761, 0.009
anaglyph_right_row3 = -0.026, -0.093, 1.234

;------------------------------------------------------------------------------------------------------
; Settings for GPU manipulations.
; Render settings override
;------------------------------------------------------------------------------------------------------
[Rendering]
override_directory_dm=ShaderFixesDM
dm_auto_patch_failure_path = DMAutoPatchFailures
dm_auto_patch_cache_path = DMAutoPatchCache
dm_auto_patch_cache_auto_scissor_path = AutoScissor
dm_auto_patch_cache_hud_path = Hud

; Automatically patched shaders will be written here if caching is enabled.
cache_directory_dm=ShaderCacheDM

