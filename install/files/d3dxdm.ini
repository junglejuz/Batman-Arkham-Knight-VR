;------------------------------------------------------------------------------------------------------
; Stereo hot keys management and settings
;------------------------------------------------------------------------------------------------------
[Constants]

global $increaseconvergence = 0
global $increaseconvergencefast = 1.05
global $increaseconvergencespeed = 0
global $increaseconvergencetime = -1

global $decreaseconvergence = 0
global $decreaseconvergencefast = 0.95
global $decreaseconvergencespeed = 0
global $decreaseconvergencetime = -1

global $increaseseparation = 0
global $increaseseparationspeed = 0
global $increaseseparationtime = -1

global $decreaseseparation = 0
global $decreaseseparationspeed = 0
global $decreaseseparationtime = -1

global $hideosdchangeindicatortime = -1

global $increaseconvergencetransition = 1
global $decreaseconvergencetransition = 1
global $increaseseparationtransition = 1
global $decreaseseparationtransition = 1

global $adj_sep = -1
global $adj_conv = -1
global $adj_popout_bias = -1

global $popout_bias_step_up = 0.001
global $popout_bias_step_down = 0.001

;------------------------------------------------------------------------------------------------------
[PresetIncreaseSeparationSlow]
condition = ($increaseSeparation == 1 && $increaseseparationspeed == 0 && $increaseseparationtransition == 1)
$adj_sep = separation + 1
separation = separation + 1
$increaseseparationtransition = 0
transition = 100
transition_type = linear

[PresetIncreaseSeparationFast]
condition = ($increaseSeparation == 1 && $increaseseparationspeed == 1 && $increaseseparationtransition == 1)
$adj_sep = separation + 1
separation = separation + 1
$increaseseparationtransition = 0
transition = 25
transition_type = linear

[PresetIncreaseConvergenceSlow]
condition = ($increaseconvergence == 1 && $increaseconvergencespeed == 0 && autoconvergence_enabled == 0 && $increaseconvergencetransition == 1)
$adj_conv = convergence + 0.01
convergence = convergence + 0.01
$increaseconvergencetransition = 0
transition = 100
transition_type = linear

[PresetIncreaseConvergenceFast]
condition = ($increaseconvergence == 1  && $increaseconvergencespeed == 1 && autoconvergence_enabled == 0 && $increaseconvergencetransition == 1)
$adj_conv = convergence * $increaseconvergencefast
convergence = convergence * $increaseconvergencefast
$increaseconvergencetransition = 0
transition = 50
transition_type = cosine

[PresetIncreasePopoutBiasSlow]
condition = ($increaseconvergence == 1 && $increaseconvergencespeed == 0 && autoconvergence_enabled > 0 && $increaseconvergencetransition == 1)
$adj_popout_bias = dm_popout_bias + $popout_bias_step_up
dm_popout_bias = dm_popout_bias + $popout_bias_step_up
$increaseconvergencetransition = 0
transition = 100
transition_type = linear

[PresetIncreasePopoutBiasFast]
condition = ($increaseconvergence == 1  && $increaseconvergencespeed == 1 && autoconvergence_enabled > 0 && $increaseconvergencetransition == 1)
$adj_popout_bias = dm_popout_bias + ($popout_bias_step_up * 5)
dm_popout_bias = dm_popout_bias + ($popout_bias_step_up * 5)
$increaseconvergencetransition = 0
transition = 50
transition_type = cosine

;------------------------------------------------------------------------------------------------------
[PresetDecreaseSeparationSlow]
condition = ($decreaseseparation == 1 && $decreaseseparationspeed == 0 && $decreaseseparationtransition == 1)
$adj_sep = separation - 1
separation = separation - 1
$decreaseseparationtransition = 0
transition = 100
transition_type = linear

[PresetDecreaseSeparationFast]
condition = ($decreaseseparation == 1 && $decreaseseparationspeed == 1 && $decreaseseparationtransition == 1)
$adj_sep = separation - 1
separation = separation - 1
$decreaseseparationtransition = 0
transition = 25
transition_type = linear

[PresetDecreaseConvergenceSlow]
condition = ($decreaseconvergence == 1 && $decreaseconvergencespeed == 0 && autoconvergence_enabled == 0 && convergence > 0.01 && $decreaseconvergencetransition == 1)
$adj_conv = convergence - 0.01
convergence = convergence - 0.01
$decreaseconvergencetransition = 0
transition = 100
transition_type = linear

[PresetDecreaseConvergenceFast]
condition = ($decreaseconvergence == 1 && $decreaseconvergencespeed == 1 && autoconvergence_enabled == 0 && convergence > 0.01 && $decreaseconvergencetransition == 1)
$adj_conv = convergence * $decreaseconvergencefast
convergence = convergence * $decreaseconvergencefast
$decreaseconvergencetransition = 0
transition = 50
transition_type = cosine

[PresetDecreasePopoutBiasSlow]
condition = ($decreaseconvergence == 1 && $decreaseconvergencespeed == 0 && autoconvergence_enabled > 0 && convergence > 0.01 && $decreaseconvergencetransition == 1)
$adj_popout_bias = dm_popout_bias - $popout_bias_step_down
dm_popout_bias = dm_popout_bias - $popout_bias_step_down
$decreaseconvergencetransition = 0
transition = 100
transition_type = linear

[PresetDecreasePopoutBiasFast]
condition = ($decreaseconvergence == 1 && $decreaseconvergencespeed == 1 && autoconvergence_enabled > 0 && convergence > 0.01 && $decreaseconvergencetransition == 1)
$adj_popout_bias = dm_popout_bias - ($popout_bias_step_down * 5)
dm_popout_bias = dm_popout_bias - ($popout_bias_step_down * 5)
$decreaseconvergencetransition = 0
transition = 50
transition_type = cosine

;------------------------------------------------------------------------------------------------------
[CommandListIncreaseConvergenceStart]
$increaseconvergence = 1
$increaseconvergencespeed = 0
$increaseconvergencetime = time

[CommandListIncreaseConvergenceStop]
$increaseconvergence = 0
$increaseconvergencespeed = 0
$increaseconvergencetime = -1

[CommandListIncreaseConvergence]
run = CommandListIncreaseConvergenceStart
post run = CommandListIncreaseConvergenceStop

[CommandListDecreaseConvergenceStart]
$decreaseconvergence = 1
$decreaseconvergencespeed = 0
$decreaseconvergencetime = time

[CommandListDecreaseConvergenceStop]
$decreaseconvergence = 0
$decreaseconvergencespeed = 0
$decreaseconvergencetime = -1

[CommandListDecreaseConvergence]
run = CommandListDecreaseConvergenceStart
post run = CommandListDecreaseConvergenceStop

[CommandListIncreaseSeparationStart]
$increaseseparation = 1
$increaseseparationspeed = 0
$increaseseparationtime = time

[CommandListIncreaseSeparationStop]
$increaseseparation = 0
$increaseseparationspeed = 0
$increaseseparationtime = -1

[CommandListIncreaseSeparation]
run = CommandListIncreaseSeparationStart
post run = CommandListIncreaseSeparationStop

[CommandListDecreaseSeparationStart]
$decreaseseparation = 1
$decreaseseparationspeed = 0
$decreaseseparationtime = time

[CommandListDecreaseSeparationStop]
$decreaseseparation = 0
$decreaseseparationspeed = 0
$decreaseseparationtime = -1

[CommandListDecreaseSeparation]
run = CommandListDecreaseSeparationStart
post run = CommandListDecreaseSeparationStop

;------------------------------------------------------------------------------------------------------

[KeyToggleStereo]
Key = ctrl t
type = toggle
dm_stereo_enabled = !dm_stereo_enabled

[KeyToggleOverlayStereoParams]
Key = ctrl F1
type = toggle
show_stereo_params = 1

[KeyDecreaseSeparation]
Key = ctrl F3
type = hold
run = CommandListDecreaseSeparation

[KeyIncreaseSeparation]
Key = ctrl F4
type = hold
run = CommandListIncreaseSeparation

[KeyDecreaseConvergence]
Key = ctrl F5
type = hold
run = CommandListDecreaseConvergence

[KeyIncreaseConvergence]
Key = ctrl F6
type = hold
run = CommandListIncreaseConvergence

[KeySaveSettings]
Key = ctrl F7
run = CommandListSaveSettings

;------------------------------------------------------------------------------------------------------
[CommandListSaveSettings]

if ($adj_sep == separation || $adj_conv == convergence || $adj_popout_bias == dm_popout_bias)
	show_osd_change_indicator = 4
	$hideosdchangeindicatortime = time
	osd_change_indicator_opacity = 1.0
endif
if ($adj_sep == separation)
	pre persist separation = $adj_sep
endif
if ($adj_conv == convergence)
	pre persist convergence = $adj_conv
endif
if ($adj_popout_bias == dm_popout_bias)
	pre persist dm_popout_bias = $adj_popout_bias
endif

;------------------------------------------------------------------------------------------------------
[Present]

if ($increaseconvergencetime != -1)
	if time - $increaseconvergencetime > 3.0
		$increaseconvergencespeed = 1
		$increaseconvergencefast = 1.05
	else if time - $increaseconvergencetime > 0.25
		$increaseconvergencespeed = 1
		$increaseconvergencefast = 1.01
	else
		$increaseconvergencespeed = 0
	endif
endif
if ((convergence * $increaseconvergencefast) - convergence) < 0.01
	$increaseconvergencefast = (convergence + 0.01) / convergence
endif
if ($increaseconvergencetransition == 0)
	$increaseconvergencetransition = 1
endif

preset = PresetIncreaseConvergenceSlow
preset = PresetIncreaseConvergenceFast
preset = PresetIncreasePopoutBiasSlow
preset = PresetIncreasePopoutBiasFast

if ($decreaseconvergencetime != -1)
	if time - $decreaseconvergencetime > 3.0
		$decreaseconvergencespeed = 1
		$decreaseconvergencefast = 0.95
	else if time - $decreaseconvergencetime > 0.25
		$decreaseconvergencespeed = 1
		$decreaseconvergencefast = 0.99
	else
		$decreaseconvergencespeed = 0
	endif
endif
if (convergence - (convergence * $decreaseconvergencefast)) < 0.01
	$decreaseconvergencefast = (convergence - 0.01) / convergence
endif
if ($decreaseconvergencetransition == 0)
	$decreaseconvergencetransition = 1
endif
if ($increaseseparationtime != -1)
	if time - $increaseseparationtime > 0.25
		$increaseseparationspeed = 1
	else
		$increaseseparationspeed = 0
	endif
endif
if ($increaseseparationtransition == 0)
	$increaseseparationtransition = 1
endif

if ($decreaseseparationtime != -1)
	if time - $decreaseseparationtime > 0.25
		$decreaseseparationspeed = 1
	else
		$decreaseseparationspeed = 0
	endif
endif
if ($decreaseseparationtransition == 0)
	$decreaseseparationtransition = 1
endif
preset = PresetDecreaseConvergenceSlow
preset = PresetDecreaseConvergenceFast
preset = PresetDecreasePopoutBiasSlow
preset = PresetDecreasePopoutBiasFast
preset = PresetDecreaseSeparationSlow
preset = PresetDecreaseSeparationFast
preset = PresetIncreaseSeparationSlow
preset = PresetIncreaseSeparationFast

; Fade-out indicator: pop up the Sep:/Conv: readout on a hotkey hit, hold
; briefly, then fade. Only drawn by the IMGUI overlay; the old
; DirectXTK overlay (overlay=1) ignores show_osd_change_indicator.
if $increaseSeparation || $decreaseseparation || $increaseconvergence || $decreaseconvergence
	show_osd_change_indicator = 1
	$hideosdchangeindicatortime = time
	osd_change_indicator_opacity = 1.0
else if $hideosdchangeindicatortime == -1
	show_osd_change_indicator = 0
else if $hideosdchangeindicatortime + osd_change_indicator_fade_lead_time + osd_change_indicator_fade_time < time
	show_osd_change_indicator = 0
	$hideosdchangeindicatortime = -1
else if $hideosdchangeindicatortime + osd_change_indicator_fade_lead_time < time
	osd_change_indicator_opacity = (osd_change_indicator_fade_time - (time - $hideosdchangeindicatortime - osd_change_indicator_fade_lead_time)) / osd_change_indicator_fade_time
endif

; AKVR: keep the tiny brightness-measuring pictures the same in both eyes
[TextureOverrideAKVRTinyRT]
